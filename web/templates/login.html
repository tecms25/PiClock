{% extends "base.html" %}
{% block title %}Sign in - PiClock{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Sign in</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           autofocus {% if wait %}disabled{% endif %}>
    <button type="submit" {% if wait %}disabled{% endif %}>Sign in</button>
  </form>
</div>
{% endblock %}
